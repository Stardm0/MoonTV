name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.14.0

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: pnpm-store-node22-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-node22-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store

      # src/lib/runtime.ts 与 public/manifest.json 是 .gitignore 里的生成物，
      # 不先生成的话 typecheck 会在 src/lib/config.ts 上报
      # "Cannot find module './runtime'"。
      - name: Generate runtime files
        run: pnpm run gen:manifest && pnpm run gen:runtime

      - name: Run linting
        run: pnpm run lint

      - name: Run type check
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build project
        run: pnpm run build
